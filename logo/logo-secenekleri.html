<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#eef0f4;font-family:Segoe UI,Arial,sans-serif;padding:28px;width:1100px}
.row{display:flex;gap:36px;justify-content:center}
.card{background:#fff;border-radius:18px;padding:22px 26px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card h2{margin:14px 0 4px;font-size:26px;color:#142049}
.card p{margin:0;color:#666;font-size:14px}
.small{display:flex;gap:14px;justify-content:center;align-items:end;margin-top:14px}
.phone{background:#1b1f27;border-radius:14px;padding:12px 10px 8px;margin-top:14px;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:13px}
.phone svg{margin-bottom:5px}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2b63"/><stop offset="1" stop-color="#101838"/></linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a4d"/><stop offset="1" stop-color="#ff6a1f"/></linearGradient>

    <!-- A: Garson (kafa + papyon + yaka) elinde servis kapagi -->
    <g id="A">
      <rect width="512" height="512" rx="112" fill="url(#bg)"/>
      <!-- tepsi + kapak (sag ust) -->
      <path d="M268 178 a92 92 0 0 1 184 0 z" fill="url(#or)"/>
      <circle cx="360" cy="80" r="15" fill="url(#or)"/>
      <rect x="252" y="178" width="216" height="20" rx="10" fill="#fff"/>
      <!-- kol -->
      <path d="M318 198 L318 262 Q318 300 282 318 L250 334" stroke="#fff" stroke-width="30" fill="none" stroke-linecap="round"/>
      <!-- kafa -->
      <circle cx="168" cy="190" r="62" fill="#fff"/>
      <!-- govde / ceket -->
      <path d="M62 452 Q62 300 168 290 Q274 300 274 452 z" fill="#fff"/>
      <!-- yaka V -->
      <path d="M130 296 L168 360 L206 296 Z" fill="#1d2b63"/>
      <!-- papyon -->
      <path d="M168 330 L128 308 L128 352 Z M168 330 L208 308 L208 352 Z" fill="url(#or)"/>
      <circle cx="168" cy="330" r="10" fill="#ff6a1f"/>
    </g>

    <!-- B: Servis kapagi + papyon -->
    <g id="B">
      <rect width="512" height="512" rx="112" fill="url(#bg)"/>
      <path d="M96 270 a160 160 0 0 1 320 0 z" fill="url(#or)"/>
      <circle cx="256" cy="98" r="22" fill="url(#or)"/>
      <path d="M150 190 a110 110 0 0 1 60 -58" stroke="#fff" stroke-opacity=".45" stroke-width="16" fill="none" stroke-linecap="round"/>
      <rect x="68" y="270" width="376" height="30" rx="15" fill="#fff"/>
      <!-- papyon -->
      <path d="M256 380 L168 338 Q150 330 150 350 L150 410 Q150 430 168 422 Z" fill="#fff"/>
      <path d="M256 380 L344 338 Q362 330 362 350 L362 410 Q362 430 344 422 Z" fill="#fff"/>
      <rect x="232" y="356" width="48" height="48" rx="14" fill="url(#or)"/>
    </g>

    <!-- C: Harf G + servis kapagi -->
    <g id="C">
      <rect width="512" height="512" rx="112" fill="url(#or)"/>
      <path d="M380 180 A150 150 0 1 0 406 300 L406 262 L276 262" stroke="#fff" stroke-width="52" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M206 262 a50 50 0 0 1 100 0 z" fill="#1d2b63" transform="translate(-40 40)"/>
      <circle cx="216" cy="248" r="9" fill="#1d2b63"/>
      <rect x="152" y="300" width="128" height="14" rx="7" fill="#1d2b63"/>
    </g>
  </defs>
</svg>

<div class="row">
  <div class="card">
    <svg width="260" height="260" viewBox="0 0 512 512"><use href="#A"/></svg>
    <h2>Seçenek 1</h2><p>Papyonlu garson, elinde servis tepsisi</p>
    <div class="small"><svg width="96" height="96" viewBox="0 0 512 512"><use href="#A"/></svg><svg width="48" height="48" viewBox="0 0 512 512"><use href="#A"/></svg></div>
    <div class="phone"><svg width="58" height="58" viewBox="0 0 512 512"><use href="#A"/></svg>EnsariPOS Garson</div>
  </div>
  <div class="card">
    <svg width="260" height="260" viewBox="0 0 512 512"><use href="#B"/></svg>
    <h2>Seçenek 2</h2><p>Servis kapağı + garson papyonu</p>
    <div class="small"><svg width="96" height="96" viewBox="0 0 512 512"><use href="#B"/></svg><svg width="48" height="48" viewBox="0 0 512 512"><use href="#B"/></svg></div>
    <div class="phone"><svg width="58" height="58" viewBox="0 0 512 512"><use href="#B"/></svg>EnsariPOS Garson</div>
  </div>
  <div class="card">
    <svg width="260" height="260" viewBox="0 0 512 512"><use href="#C"/></svg>
    <h2>Seçenek 3</h2><p>"G" harfi içinde servis kapağı</p>
    <div class="small"><svg width="96" height="96" viewBox="0 0 512 512"><use href="#C"/></svg><svg width="48" height="48" viewBox="0 0 512 512"><use href="#C"/></svg></div>
    <div class="phone"><svg width="58" height="58" viewBox="0 0 512 512"><use href="#C"/></svg>EnsariPOS Garson</div>
  </div>
</div>
</body></html>
