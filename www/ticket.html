        function egShowPortionPicker(portions, onPick) {
            $('#egPortionPicker,.eg-islemler-backdrop').remove();

            portions.forEach(function (p) {
                var label = p.name + (p.price ? ' ' + Number(p.price).toFixed(2) : '');
                $('<button type="button" class="eg-islemler-btn"></button>').text(label).on('click', function () {
                    $('.eg-islemler-backdrop,#egPortionPicker').remove();
                    onPick(p.name);
                }).appendTo(box);
            });

<body class="eg-order">
    <!-- EnsariPOS Garson v2: garsonsys / garson.png tarzi siparis ekrani (ust baslik, solda
         kategoriler, ustte adet, ortada urunler, altta sepet ozeti + TAMAM). Mantik DEGISMEDI. -->
    <div class="eg-tk-head" id="egTkHead">
        <div id="masanumara" style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;"></div>
        <span class="eg-tk-head__user user" style="flex:0 1 auto;"></span>
        <button type="button" class="eg-tb-btn" id="egSearchBtn" title="Ürün ara">🔍</button>
        <button type="button" class="eg-tb-btn" id="egIslemlerBtn" title="İşlemler (Hesap, Ödeme, Masa Taşı vb.)">🧾</button>
    </div>
    <div id="Kategori" class="kategori"></div>
    <div class="urun">

        <div id="Urun"></div>
    </div>
    <div id="radio"></div>

    <div data-role="main" class="ui-content">
    </div>
    <div class="scrollbar">
        <ul class="list-group" id="Orders"></ul>
    </div>

    <div id="model"></div>
    <div id="model2"></div>
    <div id="model3"></div>
    <div id="value" style="display:none;"></div>
    <div class="eg-orderbar" id="egOrderBar">
        <button type="button" class="eg-cartbtn" id="egCartBtn">
            <span class="eg-cartbtn__count" id="egCartCount">0</span>
            <span class="eg-cartbtn__text"><small id="egCartLabel">Yeni sipariş yok</small><b id="egCartTotal">0.00 TL</b></span>
            <span class="eg-cartbtn__chev" id="egCartChev">▲</span>
        </button>
        <button type='button' class="eg-btn eg-btn--green fBtn" id="buttonkapat" onclick=kapat()>✖ KAPAT</button>
    </div>
    <script>
        /* 29.09.2026 düzeltmesi: bottom-nav ile Menü/Sipariş görünümlerini
           birbirinin yerine geçirme denemesi CANLIDA "sipariş/ödeme
           çalışmıyor" şikayetine yol açtı - kategori/ürün ve sipariş
           overlay'i ARTIK HİÇBİR ŞEKİLDE gizlenmiyor, hep eskisi gibi
           (orijinal .scrollbar show/hide mantığı DOKUNULMADI). "Ara" ve
           "İşlemler" sadece EKSTRA, üstüne eklenen (additive) iki ikon. */
        var egTicketUid = '';
        function egFilterUrun(text) {
            var t = (text || '').toLocaleLowerCase('tr');
            $('#Urun button').each(function () {
                var name = ($(this).data('value') || '').toString().toLocaleLowerCase('tr');
                $(this).toggle(!t || name.indexOf(t) !== -1);
            });
        }
        var egSearchOpen = false;
        $(function () {
            $('#egSearchBtn').on('click', function () {
                egSearchOpen = !egSearchOpen;
                egToggleSearch(egSearchOpen, egFilterUrun);
            });
            $('#egIslemlerBtn').on('click', function () {
                egOpenIslemler(terminalID, function () { return egTicketUid; }, {
                    excludeNames: [storage.getItem('automation')],
                    onOpen: function (result) {
                        $('#Orders').empty(); $('#value').empty(); setTicket(result);
                    },
                    onClosed: function () {
                        /* 29.09.2026 duzeltmesi: hesap()/ticket_load.html ile
                           AYNI - navigasyondan ONCE GERCEKTEN closeTerminalTicket
                           cagrilir, yoksa SambaPOS'ta adisyon acik kalip bir
                           dahaki girişte icerigi bos gorunuyordu. */
                        closeTerminalTicket(terminalID, function () {
                            alert('İşlem tamamlandı, adisyon kapatıldı.');
                            postRefresh(function () { window.location = "index.html"; });
                        });
                    }
                });
            });
        });
    </script>
    <script>
        // Baslik: "B11  Yeni" / "B11  #214"
        function masanumarası() {
            var ticketid = storage.getItem('ticketId');
            var masaadi = storage.getItem("Masa") || '';
            $("#masanumara").html('<span class="eg-tk-head__table">' + egEsc(masaadi) + '</span>' +
                '<span class="eg-tk-head__id">' + (ticketid ? '#' + egEsc(ticketid) : 'Yeni adisyon') + '</span>');
        }
        // Aktif kategori vurgusu
        var egOrigMenugetir = menugetir;
        menugetir = function (a) {
            $('#Kategori input').removeClass('eg-active');
            $(a).addClass('eg-active');
            egOrigMenugetir(a);
        };
        // Sepet ozeti: bu ekranda eklenen (yeni) siparisler + adisyon toplami
        function egUpdateCart(ticket) {
            var n = 0;
            $('#Orders > li.oBtn').each(function () {
                var t = $(this).clone().children().remove().end().text();
                var m = /^\s*(\d+)x/.exec(t);
                n += m ? parseInt(m[1], 10) : 1;
            });
            var total = ticket ? Number(ticket.totalAmount) || 0 : 0;
            $('#egCartCount').text(n);
            $('#egCartLabel').text(n ? n + ' yeni ürün · dokunun: düzenle' : 'Yeni sipariş yok');
            $('#egCartTotal').text('Toplam ' + total.toFixed(2) + ' TL');
            $('#egCartBtn').toggleClass('has-items', n > 0);
            $('#buttonkapat').html(n ? '✔ TAMAM' : '✖ KAPAT');
            if (n) { $('#egCartCount').removeClass('eg-pulse'); void document.getElementById('egCartCount').offsetWidth; $('#egCartCount').addClass('eg-pulse'); }
        }
        var egOrigSetTicket = setTicket;
        setTicket = function (ticket) {
            egOrigSetTicket(ticket);
            egUpdateCart(ticket);
            egHaptic(10);
        };
        function egLayoutOrder() {
            var head = document.getElementById('egTkHead'), bar = document.getElementById('egOrderBar');
            if (!head || !bar) return;
            document.body.style.setProperty('--eg-tk-top', head.offsetHeight + 'px');
            document.body.style.setProperty('--eg-ob-h', bar.offsetHeight + 'px');
        }
        $(function () {
            egLayoutOrder();
            $(window).on('resize orientationchange', egLayoutOrder);
            $('#egCartBtn').on('click', function () {
                if (!$('#Orders > li').length) return;
                $('body').toggleClass('eg-cart-open');
                $('#egCartChev').text($('body').hasClass('eg-cart-open') ? '▼' : '▲');
            });
            egUpdateCart(null);
        });
    </script>
    <script>
        function openNav() {
            $("#Kategori").empty();
            getMenu(myMenu);
            document.getElementById("myNav").style.width = "100%";
        }

        function closeNav() {
            document.getElementById("myNav").style.width = "0%";
        }
    </script>
